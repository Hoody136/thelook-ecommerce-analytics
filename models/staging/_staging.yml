version: 2

models:
  - name: stg_thelook__users
    description: One row per registered user - identity, geography, acquisition source, signup date.
    columns:
      - name: user_id
        description: Primary key. One row per user.
        data_tests:
          - unique
          - not_null

  - name: stg_thelook__products
    description: One row per product - name, category, retail_price. Also has cost, useful for profitability calculations.
    columns:
      - name: product_id
        description: Primary key. One row per product.
        data_tests:
          - unique
          - not_null

  - name: stg_thelook__orders
    description: One row per order. Contains user_id, status, and lifecycle timestamps. Order value requires a join to order_items.
    columns:
      - name: order_id
        description: Primary key. One row per order.
        data_tests:
          - unique
          - not_null
      - name: user_id
        description: Foreign key to users.
      - name: number_of_items
        description: Number of items in the order.
      - name: status
        description: Order status - Processing, Shipped, Complete, Cancelled or Returned.
        data_tests:
          - accepted_values:
              arguments:
                values: ['Processing', 'Shipped', 'Complete', 'Cancelled', 'Returned']

  - name: stg_thelook__order_items
    description: One row per order line item - the individual lines on a customer's receipt. Contains order_id, product_id, user_id, sale_price and lifecycle timestamps.
    columns:
      - name: order_item_id
        description: Primary key. One row per order line.
        data_tests:
          - unique
          - not_null
      - name: status
        description: Line status - Processing, Shipped, Complete, Cancelled or Returned.
      - name: order_id
        description: Foreign key to orders.
        data_tests:
          # A prior extract of this source had 71 orphan order_items; verified clean
          # against bigquery-public-data (query in README). Kept at error severity.
          - relationships:
              arguments:
                to: ref('stg_thelook__orders')
                field: order_id
      - name: product_id
        description: Foreign key to products.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_thelook__products')
                field: product_id
      - name: inventory_item_id
        description: Foreign key to the physical stock unit sold. Bridges sale_price to unit cost - the margin path.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_thelook__inventory_items')
                field: inventory_item_id

  - name: stg_thelook__inventory_items
    description: One row per physical stock unit. Cost, product_id, category, brand, name, sku. sold_at NULL = still in stock.
    columns:
      - name: inventory_item_id
        description: Primary key. One row per physical unit.
        data_tests:
          - unique
          - not_null
      - name: sold_at
        description: When this unit sold. NULL = still in stock.

  - name: stg_thelook__events
    description: One row per user interaction with the platform.
    columns:
      - name: event_id
        description: Primary key. One row per event.
        data_tests:
          - unique
          - not_null
      - name: sequence_number
        description: Order of the event within its session.
      - name: session_id
        description: Groups events into a session.
      - name: traffic_source
        description: Source of the traffic - email, adwords, facebook, youtube or organic.

  - name: stg_thelook__distribution_centers
    description: One row per distribution center - name and location.
    columns:
      - name: distribution_center_id
        description: Primary key. One row per distribution center.
        data_tests:
          - unique
          - not_null